apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: my-pipeline-run-
spec:
  pipelineRef:
    name: first-pipeline
  workspaces:
    - name: shared-workspace  # Must match the workspace name in your Pipeline
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          # Optional: specify a custom StorageClass if needed
          # storageClassName: fast-storage
