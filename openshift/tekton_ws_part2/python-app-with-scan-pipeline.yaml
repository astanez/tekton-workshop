apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: python-app-with-scan-pipeline
spec:
  workspaces:
    - name: shared-data
      description: "Workspace to share code between tasks"
  params:
    - name: repo-url
      type: string
      description: "Git repository URL containing the Python app and Dockerfile"
      default: "https://github.com/astanez/tekton-workshop.git"
    - name: image-reference
      type: string
      description: "The internal image registry path (without the tag)"
      default: "image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/python-web-app"
    - name: dockerfile
      type: string
      default: "./Dockerfile"
  tasks:
    # Task 1: Clone the code
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: URL
          value: "$(params.repo-url)"
        - name: deleteExisting
          value: "true"

    # Task 2: Build and push the image with Buildah
    - name: build-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: IMAGE
          value: "$(params.image-reference):$(context.pipelineRun.name)"
        - name: DOCKERFILE
          value: "$(params.dockerfile)"
        - name: TLSVERIFY
          value: "false"

    # Task 3: Scan the image for vulnerabilities with Trivy
    - name: trivy-scan
      runAfter:
        - build-image
      params:
        - name: IMAGE
          value: "$(params.image-reference):$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: IMAGE
            type: string
        steps:
          - name: scan
            image: docker.io/aquasec/trivy:latest
            script: |
              #!/usr/bin/env sh
              set -e
              echo "Scanning image $(params.IMAGE) for vulnerabilities..."
              trivy image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --insecure \
                "$(params.IMAGE)"

    # Task 4: Update the Deployment with the newly built image
    - name: deploy-app
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - trivy-scan
      params:
        - name: SCRIPT
          value: |
            IMAGE_WITH_TAG="$(params.image-reference):$(context.pipelineRun.name)"

            echo "Updating deployment/python-web-app image to $IMAGE_WITH_TAG..."
            oc set image deployment/python-web-app python-web-app=$IMAGE_WITH_TAG
            oc rollout status deployment/python-web-app --timeout=120s
