apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: spring-boot-withscan-pipeline
spec:
  workspaces:
    - name: shared-data
      description: "Workspace to share code between tasks"
  params:
    - name: repo-url
      type: string
      default: "https://github.com/astanez/minimal-java-spring-app.git"
    - name: image-reference
      type: string
      description: "The internal image registry path (without the tag)"
      default: "image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/spring-app"
  tasks:
    # Task 1: Clone the code
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines 
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: URL
          value: "$(params.repo-url)"
        - name: deleteExisting
          value: "true"

    # Task 2: Build the Java application into an image
    - name: build-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: s2i-java
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: IMAGE
          # Dynamically tags the image using the unique PipelineRun name
          value: "$(params.image-reference):$(context.pipelineRun.name)"

    # Task 3: Scan the image for vulnerabilities with Trivy
    - name: trivy-scan
      runAfter:
        - build-image
      params:
        - name: IMAGE
          value: "$(params.image-reference):$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: IMAGE
            type: string
        steps:
          - name: scan
            image: docker.io/aquasec/trivy:latest
            script: |
              #!/usr/bin/env sh
              set -e
              echo "Scanning image $(params.IMAGE) for vulnerabilities..."
              trivy image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --insecure \
                "$(params.IMAGE)"

    # Task 4: Deploy the image to OpenShift
    - name: deploy-app
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - trivy-scan
      params:
        - name: SCRIPT
          value: |
            # Construct the exact same image tag used in Task 2
            IMAGE_WITH_TAG="$(params.image-reference):$(context.pipelineRun.name)"
            
            # Check if deployment exists. If not, create it and expose it.
            if ! oc get deployment/spring-app; then
              echo "Creating new Deployment..."
              oc create deployment spring-app --image=$IMAGE_WITH_TAG
              oc set env deployment/spring-app PORT=8080
              oc expose deployment/spring-app --port=8080 --target-port=8080
              oc expose svc/spring-app
            fi
            
            # Trigger a rollout with the newly built image
            echo "Updating image to trigger rollout..."
            oc set image deployment/spring-app spring-app=$IMAGE_WITH_TAG
